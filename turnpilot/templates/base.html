<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TurnPilot{% endblock %} · TurnPilot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script type="importmap">{"imports": {"three": "{{ url_for('static', filename='vendor/three/three.module.min.js') }}"}}</script>
  <script type="module" src="{{ url_for('static', filename='part3d.js') }}"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('main.index') }}">TurnPilot</a>
    <nav>
      <a href="{{ url_for('main.shop') }}">Shop</a>
      <a href="{{ url_for('main.machines') }}">Machines</a>
      <a href="{{ url_for('main.cutting_data') }}">Cutting data</a>
      <a href="{{ url_for('main.jobs') }}">Jobs</a>
      <a href="{{ url_for('main.upload_drawing') }}">Upload drawing</a>
    </nav>
  </header>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash flash-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
