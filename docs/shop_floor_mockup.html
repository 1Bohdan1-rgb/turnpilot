<title>TurnPilot Shop Floor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: drawing-sheet plan (top view, 1:200) on the left, machine card on the right; stacks on phones */
:root{
  --paper:#E9EEF0; --sheet:#F6F8F9; --ink:#1F2B33; --ink2:#5B6B75; --hair:#C3CED4;
  --wall:#2A3740; --mach:#D5DDE2; --mach2:#BAC6CD; --glass:#DCEAF1; --stone:#C9C4BC;
  --aisle:#D9A900; --accent:#1F6F8B;
  --run:#2E9E5B; --setup:#3B78C9; --stop:#D0453B; --free:#8A979F;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0F161A; --sheet:#141D22; --ink:#D3DDE2; --ink2:#8C9CA5; --hair:#2B3A42;
  --wall:#B9C7CE; --mach:#26343C; --mach2:#33444D; --glass:#1C3340; --stone:#3A3833;
  --aisle:#E3B520; --accent:#5DB3D0; --run:#3FBF74; --setup:#5B95E0; --stop:#E8655B; --free:#6E7D86;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F161A; --sheet:#141D22; --ink:#D3DDE2; --ink2:#8C9CA5; --hair:#2B3A42;
  --wall:#B9C7CE; --mach:#26343C; --mach2:#33444D; --glass:#1C3340; --stone:#3A3833;
  --aisle:#E3B520; --accent:#5DB3D0; --run:#3FBF74; --setup:#5B95E0; --stop:#E8655B; --free:#6E7D86;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}
header{display:flex;flex-wrap:wrap;align-items:end;gap:12px 24px;margin-bottom:14px}
h1{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:.02em;margin:0;text-wrap:balance}
.sub{color:var(--ink2);font-size:13px;margin:2px 0 0}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-left:auto}
#q{font:inherit;font-size:14px;padding:8px 12px;border:1px solid var(--hair);background:var(--sheet);color:var(--ink);border-radius:6px;width:220px;max-width:100%}
#q:focus-visible,.chip:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip{font:500 12px var(--f-body);letter-spacing:.04em;text-transform:uppercase;padding:6px 10px;border-radius:99px;border:1px solid var(--hair);background:var(--sheet);color:var(--ink);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:900px){.wrap{grid-template-columns:minmax(0,1fr)}}
.planbox{background:var(--sheet);border:1px solid var(--hair);border-radius:4px;overflow-x:auto;min-width:0}
svg.plan{display:block;width:100%;min-width:1000px;height:auto}
.plan text{font-family:var(--f-mono);fill:var(--ink2)}
.m{cursor:pointer;transition:opacity .2s}
.m.dim{opacity:.18}
.m:hover .body,.m.sel .body{stroke:var(--accent);stroke-width:2.2}
.m.sel .halo{stroke-width:5}
.m:focus{outline:none}.m:focus-visible .body{stroke:var(--accent);stroke-width:2.5}
.halo{fill:none;stroke-width:3.5;opacity:.85}
.m.running .halo{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.m.running .halo{animation:none}}
aside{background:var(--sheet);border:1px solid var(--hair);border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
aside h2{font-family:var(--f-display);font-size:26px;margin:0;line-height:1}
.kind{font:12px var(--f-mono);color:var(--ink2);text-transform:uppercase;letter-spacing:.06em}
.pill{align-self:start;font:600 12px var(--f-body);letter-spacing:.05em;text-transform:uppercase;padding:4px 10px;border-radius:99px;color:#fff}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:13px}
dt{color:var(--ink2)}dd{margin:0;font-variant-numeric:tabular-nums;min-width:0;overflow-wrap:anywhere}
.bar{height:8px;background:var(--hair);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--run)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
button{font:500 13px var(--f-body);padding:8px 12px;border-radius:6px;border:1px solid var(--ink);background:var(--ink);color:var(--sheet);cursor:pointer}
button.ghost{background:transparent;color:var(--ink)}
.note{font-size:12px;color:var(--ink2);margin:0}
.count{font:12px var(--f-mono);color:var(--ink2)}
</style>

<header>

  <div class="tools">

    <button class="chip" id="f-setup" data-s="setup" aria-pressed="false"><span class="dot" style="background:var(--setup)"></span>Setup</button>
    <button class="chip" id="f-stopped" data-s="stopped" aria-pressed="false"><span class="dot" style="background:var(--stop)"></span>Stopped</button>
    <button class="chip" id="f-free" data-s="free" aria-pressed="false"><span class="dot" style="background:var(--free)"></span>Free</button>

</header>

<script>
const M = [
 {id:"L1",name:"Lathe 1",type:"lathe",kind:"CNC lathe · 2-axis",ctrl:"Fanuc 0i-T",cap:"Ø max 250 · bar Ø52",x:150,y:230,r:0,s:"running",op:"Bohdan",order:"Order 1 · 03057789-2-01",done:1,qty:50,left:"0:09:53",part:"12.1 s"},
 {id:"L2",name:"Lathe 2",type:"lathe",kind:"CNC lathe · 2-axis",ctrl:"Fanuc 0i-T",cap:"Ø max 250 · bar Ø52",x:300,y:230,r:0,s:"running",op:"Example",order:"ND 012 bushing",done:18,qty:40,left:"0:35:54",part:"97.9 s"},
 {id:"L3",name:"Lathe 3",type:"lathe",kind:"CNC lathe · 2-axis",ctrl:"Fanuc 0i-T",cap:"Ø max 300 · bar Ø65",x:450,y:230,r:0,s:"setup",op:"Example",order:"Hinge 36, part 1",done:0,qty:120,left:"setting tools",part:"33.6 s"},

 {id:"L5",name:"Lathe 5",type:"lathe",kind:"CNC lathe · Y-axis + live tools",ctrl:"Fanuc 31i-B",cap:"Ø max 350 · bar Ø65",x:750,y:230,r:0,s:"stopped",op:"Example",order:"Part 1",done:7,qty:25,left:"paused",part:"38.2 s",note:"Insert change, T04"},

 {id:"ML2",name:"Manual lathe 2",type:"manual",kind:"Manual centre lathe",ctrl:"none",cap:"Ø max 320 · 1000 between centres",x:1210,y:230,r:0,s:"running",op:"Example",order:"Repair shaft",done:0,qty:1,left:"0:40:00",part:"40 min"},

 {id:"V2",name:"Mill 2",type:"mill",kind:"Vertical machining centre",ctrl:"Fanuc 0i-M",cap:"X600 Y400 Z450 · 16 tools",x:320,y:560,r:180,s:"free"},
 {id:"V3",name:"Mill 3",type:"mill",kind:"Vertical machining centre · 4th axis",ctrl:"Fanuc 0i-M",cap:"X1000 Y550 Z550 · 24 tools",x:480,y:560,r:180,s:"setup",op:"Example",order:"Flange, 4 holes",done:0,qty:16,left:"setting tools",part:"6:10"},

 {id:"S1",name:"Saw 1",type:"saw",kind:"Band saw · bar cut-off",ctrl:"none",cap:"Ø max 260",x:1400,y:290,r:0,s:"running",op:"Example",order:"Bar cut Ø55 × 300",done:42,qty:60,left:"0:18:00",part:"60 s"},

];
const LABEL={running:"Running",setup:"Setup",stopped:"Stopped",free:"Free"};
const COL={running:"var(--run)",setup:"var(--setup)",stopped:"var(--stop)",free:"var(--free)"};
const ns="http://www.w3.org/2000/svg";

function turret(cx,cy,r,n){let s=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--mach2)" stroke="var(--ink)" stroke-width=".8"/>`;
  for(let i=0;i<n;i++){const a=i*2*Math.PI/n,x=cx+Math.cos(a)*(r+2.5),y=cy+Math.sin(a)*(r+2.5);
    s+=`<rect x="${(x-2).toFixed(1)}" y="${(y-2).toFixed(1)}" width="4" height="4" fill="var(--ink2)" transform="rotate(${i*360/n} ${x.toFixed(1)} ${y.toFixed(1)})"/>`}
  return s+`<circle cx="${cx}" cy="${cy}" r="3" fill="var(--ink)"/>`}
function pockets(cx,cy,r,n){let s=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--mach2)" stroke="var(--ink)" stroke-width=".8"/>`;
  for(let i=0;i<n;i++){const a=i*2*Math.PI/n;s+=`<circle cx="${(cx+Math.cos(a)*(r-4)).toFixed(1)}" cy="${(cy+Math.sin(a)*(r-4)).toFixed(1)}" r="2" fill="var(--ink2)"/>`}return s}

const SHAPE={
 lathe:()=>`
  <rect class="halo" x="-62" y="-50" width="124" height="86" rx="8"/>
  <rect x="34" y="-46" width="24" height="18" fill="var(--mach2)" stroke="var(--ink2)"/>

const g=document.getElementById("machines");
M.forEach(m=>{
  const el=document.createElementNS(ns,"g");
  el.setAttribute("class","m "+m.s);el.setAttribute("tabindex","0");el.setAttribute("role","button");
  el.setAttribute("aria-label",`${m.name}, ${LABEL[m.s]}`);el.dataset.id=m.id;
  el.setAttribute("transform",`translate(${m.x} ${m.y}) rotate(${m.r}) scale(.78)`);
  const flip=m.r===180?` transform="rotate(180)"`:"";
  const ly={lathe:66,manual:50,mill:64,saw:44,cmm:48}[m.type];
  el.innerHTML=SHAPE[m.type]()+`<g${flip}><text y="${m.r===180?-ly+10:ly}" text-anchor="middle" font-size="16" style="fill:var(--ink);font-family:var(--f-display);font-weight:600;letter-spacing:.5px">${m.name.toUpperCase()}</text></g>`;
  el.querySelector(".halo").style.stroke=COL[m.s];el.querySelector(".lamp").style.fill=COL[m.s];
  el.addEventListener("click",()=>select(m.id));
  el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();select(m.id)}});
  g.appendChild(el);
});

// columns on a 6 m grid (150 units = 6 000 mm), interior row above the walkway
const cols=document.getElementById("cols"),axes=document.getElementById("axes");
const put=(x,y)=>cols.insertAdjacentHTML("beforeend",`<rect x="${x-6}" y="${y-6}" width="12" height="12"/>`);
for(let i=0;i<=12;i++){const x=40+i*150;
  if(x<=1300)put(x,60); if(x>=1300)put(x,180);
  if(i>0&&i<12)put(x,370);
  if(x<=700)put(x,820);
  if(i>0&&i<12)axes.insertAdjacentHTML("beforeend",`<g transform="translate(${x} 356)"><circle r="9" fill="var(--sheet)" stroke="var(--ink2)"/><text y="4" text-anchor="middle" font-size="10">${i+1}</text></g>`);
}
let filterS=null,sel="L1";
function apply(){
  const q=document.getElementById("q").value.trim().toLowerCase();let n=0;
  M.forEach(m=>{const hay=[m.name,m.kind,m.ctrl,m.type,LABEL[m.s],m.order||""].join(" ").toLowerCase();
    const ok=(!q||hay.includes(q))&&(!filterS||m.s===filterS);if(ok)n++;
    g.querySelector(`[data-id="${m.id}"]`).classList.toggle("dim",!ok)});
  document.getElementById("count").textContent=`${n} of ${M.length} shown`;
}
document.getElementById("q").addEventListener("input",apply);
document.querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>{
  filterS=filterS===c.dataset.s?null:c.dataset.s;
  document.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed",b.dataset.s===filterS));apply()}));

function select(id){
  sel=id;const m=M.find(x=>x.id===id);
  g.querySelectorAll(".m").forEach(e=>e.classList.toggle("sel",e.dataset.id===id));
  const busy=m.order;const pct=busy?Math.round(m.done/m.qty*100):0;
  document.getElementById("card").innerHTML=`
    <div class="kind">${m.kind}</div>
    <h2>${m.name}</h2>
    <span class="pill" style="background:${COL[m.s]}">${LABEL[m.s]}</span>
    <dl><dt>Control</dt><dd>${m.ctrl}</dd><dt>Capacity</dt><dd>${m.cap}</dd>
    ${busy?`<dt>Order</dt><dd>${m.order}</dd><dt>Operator</dt><dd>${m.op}</dd><dt>Done</dt><dd>${m.done} of ${m.qty}</dd><dt>Per part</dt><dd>${m.part}</dd><dt>Left</dt><dd>${m.left}</dd>`:`<dt>Order</dt><dd>none running</dd>`}
    ${m.note?`<dt>Note</dt><dd>${m.note}</dd>`:""}</dl>
    ${busy?`<div class="bar" aria-label="${pct}% done"><i style="width:${pct}%;background:${COL[m.s]}"></i></div>`:""}
    <div class="btns"><button id="b-draw">Upload drawing</button><button class="ghost" id="b-open">Open machine</button></div>
    <p class="note">Mock-up: buttons are not wired. In TurnPilot, "Upload drawing" starts a new job on this machine.</p>`;
}
select("L1");apply();
</script>
